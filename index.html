<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CraftMine HD</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="hud">
      <div id="crosshair">+</div>
      <div id="hotbar"></div>
      <div id="stats"></div>
      <div id="help">
        <h1>CraftMine HD</h1>
        <p>Click to lock pointer and start.</p>
        <ul>
          <li>WASD: Move</li>
          <li>Space: Jump</li>
          <li>Shift: Sneak</li>
          <li>Ctrl: Sprint</li>
          <li>Left click: Mine block</li>
          <li>Right click: Place selected block</li>
          <li>1-8 / Mouse wheel: Select block</li>
        </ul>
      </div>
    </div>
    <canvas id="game"></canvas>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
